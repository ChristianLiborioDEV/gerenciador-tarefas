<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Gerenciador de tarefas</h1>
    <div id="divEnvio">
        <input type="text" name="entradaTitulo" id="tituloTarefa" placeholder="Insira o titulo da Tarefa">
        <div class="opcao-prioridade">
    <input type="radio" id="prioridadeBaixa" name="prioridade" value="baixa"/>
    <label for="prioridadeBaixa">Prioridade Baixa</label>
</div>
<div class="opcao-prioridade">
    <input type="radio" id="prioridadeMedia" name="prioridade" value="media"/>
    <label for="prioridadeMedia">Prioridade Media</label>
</div>
<div class="opcao-prioridade">
    <input type="radio" id="prioridadeAlta" name="prioridade" value="alta"/>
    <label for="prioridadeAlta">Prioridade Alta</label>
</div>
        <p><button type="submit">Adicionar Tarefa</button></p>
    </div>
    <div id="divPesquisa">
        <input type="text" id="buscarTarefa" placeholder="Pesquisar Tarefa"> <button type="submit">Pesquisar Tarefa</button>
    </div>
    <h2>Tarefas</h2> 
    <div id="divTarefas">
    <ul id="listaTarefas"></ul>

    </div>
    <script src="app.js"></script>
</body>
</html>
